# OpenAPI 3.1 contract for the MORN1NGST4R local API (design only, no implementation).
# Endpoint IDs (x-endpoint-id) match endpoint-inventory.md exactly.
openapi: "3.1.0"
info:
  title: "MORN1NGST4R local API"
  version: "1.0.0-design"
  summary: "Design contract for the MORN1NGST4R localhost API."
  description: "Design-only contract. No implementation exists. The API serves one local researcher account over a server-side session. There are no API tokens (D-60). Every state-changing request needs a valid Host, an allow-listed Origin, the session cookie and the X-CSRF-Token header. Examples use synthetic data only (RFC 2606 names and RFC 5737 addresses)."
  license:
    name: "Apache-2.0"
    identifier: "Apache-2.0"
jsonSchemaDialect: "https://json-schema.org/draft/2020-12/schema"
servers:
  - url: "http://{host}:{port}/api/v1"
    description: "Local development. The Host must be in the configured allow-list. Browsers reach it through the same-origin Next.js rewrite (D-79)."
    variables:
      host:
        default: "127.0.0.1"
        enum:
          - "127.0.0.1"
          - "localhost"
      port:
        default: "3000"
tags:
  - name: "auth"
    description: "Authentication and account"
  - name: "policy"
    description: "Security policy"
  - name: "program"
    description: "Programs"
  - name: "scope"
    description: "Targets, scope, labs and target authorization"
  - name: "assessment"
    description: "Assessments and plans"
  - name: "authorization"
    description: "Approvals"
  - name: "execution"
    description: "Jobs"
  - name: "asset"
    description: "Assets and endpoints"
  - name: "evidence"
    description: "Evidence"
  - name: "finding"
    description: "Findings"
  - name: "reporting"
    description: "Reports"
  - name: "ai"
    description: "AI providers and tasks"
  - name: "integration"
    description: "Tools, passive sources and integration status"
  - name: "audit"
    description: "Audit"
security:
  - sessionCookie: []
paths:
  "/session":
    get:
      operationId: "auth01"
      summary: "Report setup, anonymous or authenticated state and issue the CSRF token."
      tags:
        - "auth"
      "x-endpoint-id": "AUTH-01"
      "x-route-class": "PUB"
      "x-audit-event": "-"
      "x-rate-limit": "RL-AUTH"
      "x-prd":
