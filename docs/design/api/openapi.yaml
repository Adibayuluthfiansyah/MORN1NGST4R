        - "host_denied"
        - "internal_error"
        - "rate_limited"
      "x-scope-class": "Security-critical"
      "x-milestone": "M4"
      description: "Authorization: Public route. Host allow-list, Origin allow-list for state changes, rate limit. State precondition: none. Idempotency: Naturally idempotent (reads, or a PUT/PATCH that sets state with optimistic locking)."
      responses:
        "200":
          description: "Success."
          headers:
            "X-Request-Id":
              "$ref": "#/components/headers/XRequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/SessionState"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "500":
          "$ref": "#/components/responses/InternalError"
        "503":
          "$ref": "#/components/responses/Unavailable"
