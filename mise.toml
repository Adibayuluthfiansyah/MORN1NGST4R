# Toolchain baseline for development (tech.md section 1).
#
# Go: go1.27.4 is the recommended release toolchain. go.mod keeps the
# `go 1.26.0` floor and builds use GOTOOLCHAIN=local (D-65).
# Node: 24.x, at least 24.15.0 (D-66). apps/web/package.json enforces the
# range in `engines`. 24.22.3 is the 24.x release verified on 2026-11-15.
#
# Optional. mise only selects versions. Any installation that satisfies these
# versions works. Run `mise install go node` once, then `mise exec -- make test`
# or activate mise in your shell.
[tools]
go = "1.27.4"
node = "24.22.3"
